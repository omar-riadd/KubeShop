services:
  redis:
    image: redis:7-alpine
    profiles: ["backend", "full"]
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    profiles: ["backend", "full"]
    environment:
      POSTGRES_DB: kubeshop
      POSTGRES_USER: kubeshop
      POSTGRES_PASSWORD: kubeshop-local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeshop -d kubeshop"]
      interval: 5s
      timeout: 3s
      retries: 15

  orders-migrate:
    build:
      context: ./services
      dockerfile: orders/Dockerfile
      args:
        GIT_SHA: local
        BUILD_TIME: "local"
    profiles: ["backend", "full"]
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://kubeshop:kubeshop-local-dev-only@postgres:5432/kubeshop?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    restart: "no"

  catalog:
    build:
      context: ./services
      dockerfile: catalog/Dockerfile
      args:
        GIT_SHA: local
        BUILD_TIME: "local"
    profiles: ["backend", "full"]
    ports:
      - "8081:8080"
    environment:
      APP_ENV: local
      APP_VERSION: dev
      APP_GIT_SHA: local
      SHUTDOWN_DELAY: 0s
    read_only: true

  cart:
    build:
      context: ./services
      dockerfile: cart/Dockerfile
      args:
        GIT_SHA: local
        BUILD_TIME: "local"
    profiles: ["backend", "full"]
    ports:
      - "8082:8080"
    environment:
      APP_ENV: local
      APP_VERSION: dev
      APP_GIT_SHA: local
      REDIS_ADDR: redis:6379
      CATALOG_BASE_URL: http://catalog:8080
      SHUTDOWN_DELAY: 0s
    depends_on:
      redis:
        condition: service_healthy
      catalog:
        condition: service_started
    read_only: true

  orders:
    build:
      context: ./services
      dockerfile: orders/Dockerfile
      args:
        GIT_SHA: local
        BUILD_TIME: "local"
    profiles: ["backend", "full"]
    ports:
      - "8083:8080"
    environment:
      APP_ENV: local
      APP_VERSION: dev
      APP_GIT_SHA: local
      DATABASE_URL: postgres://kubeshop:kubeshop-local-dev-only@postgres:5432/kubeshop?sslmode=disable
      CART_BASE_URL: http://cart:8080
      SHUTDOWN_DELAY: 0s
    depends_on:
      postgres:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully
      cart:
        condition: service_started
    read_only: true

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        GIT_SHA: local
        BUILD_TIME: "local"
    profiles: ["full"]
    environment:
      APP_ENV: local
      APP_VERSION: dev
    read_only: true
    tmpfs:
      - /tmp

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    profiles: ["full"]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./deploy/compose/gateway.nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      catalog:
        condition: service_started
      cart:
        condition: service_started
      orders:
        condition: service_started
      web:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
