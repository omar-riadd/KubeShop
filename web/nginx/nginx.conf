server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers (exact match to §1.11 Shared Contract)
    include /etc/nginx/security_headers.conf;

    # Health check endpoint (§1.10)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Dynamic runtime config generated into /tmp at container start
    location = /runtime-config.json {
        alias /tmp/runtime-config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security_headers.conf;
    }

    # Synchronous classic theme-init script
    location = /theme-init.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security_headers.conf;
        try_files $uri =404;
    }

    # Hashed static assets — long-term immutable cache; missing files return 404
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security_headers.conf;
        try_files $uri =404;
    }

    # Product and placeholder images
    location /images/ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/security_headers.conf;
        try_files $uri =404;
    }

    # API requests belong to the Gateway; web nginx never proxies them
    location /api/ {
        return 404;
    }

    # Explicit index.html location so internal redirects from / always get no-cache
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security_headers.conf;
    }

    # Any other path with a file extension that does not exist returns 404
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # SPA routing fallback — never cache index.html
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security_headers.conf;
        try_files $uri /index.html;
    }
}
