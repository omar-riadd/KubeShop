<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-au-002" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Knob Gradient -->
    <radialGradient id="knob-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Spacebar Accent Gradients -->
    <linearGradient id="spacebar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="spacebar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Light Bar Beam Gradient -->
    <linearGradient id="lightbar-beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Outer Chassis Canvas -->
  <rect width="400" height="300" rx="14" fill="url(#bg-au-002)" />
  <rect x="1.5" y="1.5" width="397" height="297" rx="12.5" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6"/>

  <!-- Subtle Blueprint Tech Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
  </g>

  <!-- Top Status Bar: Category & Spec Tag -->
  <rect x="20" y="18" width="96" height="20" rx="4" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
  <text x="68" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">HYBRID ANC</text>

  <text x="380" y="32" font-family="monospace" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="0.5">-42DB HYBRID ANC · 36H BATTERY</text>

  <!-- Main Product Render Art -->
  
      <ellipse cx="200" cy="155" rx="85" ry="60" fill="#a855f7" opacity="0.2" filter="blur(22px)"/>
      <g filter="drop-shadow(0 14px 20px rgba(168, 85, 247, 0.25))">
        <!-- Open Charging Case Base -->
        <path d="M 140,140 C 140,120 260,120 260,140 C 260,185 240,205 200,205 C 160,205 140,185 140,140 Z" fill="#1e1035" stroke="#7e22ce" stroke-width="2"/>
        <!-- Charging Bays -->
        <ellipse cx="175" cy="148" rx="18" ry="22" fill="#0f0720" stroke="#a855f7" stroke-width="1.2"/>
        <ellipse cx="225" cy="148" rx="18" ry="22" fill="#0f0720" stroke="#a855f7" stroke-width="1.2"/>
        <!-- Left Earbud Head -->
        <circle cx="175" cy="142" r="12" fill="#3b0764" stroke="#c084fc" stroke-width="1.8"/>
        <circle cx="175" cy="142" r="6" fill="#a855f7"/>
        <!-- Right Earbud Head -->
        <circle cx="225" cy="142" r="12" fill="#3b0764" stroke="#c084fc" stroke-width="1.8"/>
        <circle cx="225" cy="142" r="6" fill="#a855f7"/>
        <!-- Status Battery LED Dots -->
        <circle cx="195" cy="188" r="2" fill="#c084fc"/>
        <circle cx="200" cy="188" r="2" fill="#c084fc"/>
        <circle cx="205" cy="188" r="2" fill="#c084fc"/>
      </g>
    

  <!-- Bottom Info Glow Bar -->
  <rect x="20" y="248" width="360" height="38" rx="8" fill="#0b0f19" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
  <circle cx="36" cy="267" r="4" fill="#a855f7"/>
  <text x="48" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Span Noise-Cancelling Earbuds</text>
  <text x="368" y="271" font-family="monospace" font-size="11" font-weight="700" fill="#c084fc" text-anchor="end">AU-002</text>
</svg>
