<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-ac-001" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Knob Gradient -->
    <radialGradient id="knob-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Spacebar Accent Gradients -->
    <linearGradient id="spacebar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="spacebar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Light Bar Beam Gradient -->
    <linearGradient id="lightbar-beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Outer Chassis Canvas -->
  <rect width="400" height="300" rx="14" fill="url(#bg-ac-001)" />
  <rect x="1.5" y="1.5" width="397" height="297" rx="12.5" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6"/>

  <!-- Subtle Blueprint Tech Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
  </g>

  <!-- Top Status Bar: Category & Spec Tag -->
  <rect x="20" y="18" width="96" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="68" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">BESTSELLER</text>

  <text x="380" y="32" font-family="monospace" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="0.5">900X400MM · CONTOUR TOPOGRAPHY</text>

  <!-- Main Product Render Art -->
  
      <ellipse cx="200" cy="155" rx="140" ry="60" fill="#f59e0b" opacity="0.2" filter="blur(25px)"/>
      <g filter="drop-shadow(0 14px 20px rgba(245, 158, 11, 0.25))">
        <!-- Stitched Mat Surface -->
        <rect x="65" y="90" width="270" height="120" rx="14" fill="#18120c" stroke="#f59e0b" stroke-width="2.5"/>
        <rect x="70" y="95" width="260" height="110" rx="10" fill="#24170d"/>
        <!-- Topographic Elevation Lines -->
        <path d="M 80,180 C 130,120 180,210 240,130 C 270,90 310,130 320,110" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
        <path d="M 80,160 C 125,105 175,190 230,118 C 265,80 300,115 320,95" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
        <path d="M 90,200 C 140,140 190,215 250,145 C 280,110 310,145 320,130" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.5"/>
        <path d="M 120,135 C 145,110 170,140 190,125" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.7"/>
        <circle cx="155" cy="125" r="12" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
        <!-- Woven Corner Brand Tag -->
        <rect x="285" y="185" width="30" height="12" rx="2" fill="#f59e0b"/>
        <text x="300" y="193" font-family="monospace" font-size="6" font-weight="bold" fill="#000000" text-anchor="middle">KUBE</text>
      </g>
    

  <!-- Bottom Info Glow Bar -->
  <rect x="20" y="248" width="360" height="38" rx="8" fill="#0b0f19" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
  <circle cx="36" cy="267" r="4" fill="#f59e0b"/>
  <text x="48" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Rollout Desk Mat XL</text>
  <text x="368" y="271" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="end">AC-001</text>
</svg>
