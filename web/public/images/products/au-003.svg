<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-au-003" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>

    <!-- Knob Gradient -->
    <radialGradient id="knob-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="60%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Spacebar Accent Gradients -->
    <linearGradient id="spacebar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="spacebar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Light Bar Beam Gradient -->
    <linearGradient id="lightbar-beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Outer Chassis Canvas -->
  <rect width="400" height="300" rx="14" fill="url(#bg-au-003)" />
  <rect x="1.5" y="1.5" width="397" height="297" rx="12.5" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6"/>

  <!-- Subtle Blueprint Tech Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
  </g>

  <!-- Top Status Bar: Category & Spec Tag -->
  <rect x="20" y="18" width="88" height="20" rx="4" fill="#7c3aed" fill-opacity="0.2" stroke="#7c3aed" stroke-width="1"/>
  <text x="64" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#a78bfa" text-anchor="middle" letter-spacing="0.5">BROADCAST</text>

  <text x="380" y="32" font-family="monospace" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="0.5">192KHZ/24-BIT · CARDIOID CONDENSER</text>

  <!-- Main Product Render Art -->
  
      <ellipse cx="200" cy="155" rx="75" ry="75" fill="#7c3aed" opacity="0.22" filter="blur(24px)"/>
      <g filter="drop-shadow(0 14px 22px rgba(124, 58, 237, 0.28))">
        <!-- Cast Metal Desk Base -->
        <ellipse cx="200" cy="220" rx="50" ry="12" fill="#1e1b4b" stroke="#4c1d95" stroke-width="2"/>
        <rect x="196" y="180" width="8" height="40" fill="#2e1065" stroke="#7c3aed" stroke-width="1"/>
        <!-- U-Shaped Shockmount Arms -->
        <path d="M 165,140 C 165,190 235,190 235,140" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
        <!-- Microphone Capsule Cylinder -->
        <rect x="175" y="80" width="50" height="90" rx="25" fill="#0f0728" stroke="#5b21b6" stroke-width="2"/>
        <!-- Upper Mesh Grille -->
        <path d="M 175,105 C 175,80 225,80 225,105 Z" fill="#2e1065" stroke="#a78bfa" stroke-width="1"/>
        <line x1="182" y1="85" x2="218" y2="85" stroke="#a78bfa" stroke-width="1" opacity="0.6"/><line x1="182" y1="92" x2="218" y2="92" stroke="#a78bfa" stroke-width="1" opacity="0.6"/><line x1="182" y1="99" x2="218" y2="99" stroke="#a78bfa" stroke-width="1" opacity="0.6"/>
        <!-- Glowing Gain Ring -->
        <circle cx="200" cy="135" r="8" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
        <circle cx="200" cy="135" r="3" fill="#a78bfa"/>
        <!-- Mute Touch Sensor LED -->
        <line x1="192" y1="158" x2="208" y2="158" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
      </g>
    

  <!-- Bottom Info Glow Bar -->
  <rect x="20" y="248" width="360" height="38" rx="8" fill="#0b0f19" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
  <circle cx="36" cy="267" r="4" fill="#7c3aed"/>
  <text x="48" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Mesh USB Microphone</text>
  <text x="368" y="271" font-family="monospace" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="end">AU-003</text>
</svg>
