<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-au-001" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Knob Gradient -->
    <radialGradient id="knob-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Spacebar Accent Gradients -->
    <linearGradient id="spacebar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="spacebar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Light Bar Beam Gradient -->
    <linearGradient id="lightbar-beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Outer Chassis Canvas -->
  <rect width="400" height="300" rx="14" fill="url(#bg-au-001)" />
  <rect x="1.5" y="1.5" width="397" height="297" rx="12.5" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.6"/>

  <!-- Subtle Blueprint Tech Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
  </g>

  <!-- Top Status Bar: Category & Spec Tag -->
  <rect x="20" y="18" width="96" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
  <text x="68" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#a78bfa" text-anchor="middle" letter-spacing="0.5">STUDIO PRO</text>

  <text x="380" y="32" font-family="monospace" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end" letter-spacing="0.5">50MM PLANAR DRIVER · HIGH-RES</text>

  <!-- Main Product Render Art -->
  
      <ellipse cx="200" cy="155" rx="100" ry="80" fill="#8b5cf6" opacity="0.22" filter="blur(26px)"/>
      <g filter="drop-shadow(0 14px 22px rgba(139, 92, 246, 0.3))">
        <!-- Spring Steel Headband -->
        <path d="M 125,160 C 120,85 280,85 275,160" fill="none" stroke="#4c1d95" stroke-width="8" stroke-linecap="round"/>
        <path d="M 135,150 C 135,95 265,95 265,150" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
        <!-- Padded Headband Cushion -->
        <path d="M 155,108 C 175,98 225,98 245,108" fill="none" stroke="#1e1b4b" stroke-width="12" stroke-linecap="round"/>
        <!-- Metal Sliders & Pivot Yokes -->
        <rect x="117" y="145" width="14" height="22" rx="4" fill="#6d28d9" stroke="#a78bfa" stroke-width="1"/>
        <rect x="269" y="145" width="14" height="22" rx="4" fill="#6d28d9" stroke="#a78bfa" stroke-width="1"/>
        <!-- Left Plush Ear Cup -->
        <rect x="110" y="155" width="28" height="60" rx="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
        <rect x="122" y="160" width="12" height="50" rx="6" fill="#0f172a"/>
        <!-- Right Plush Ear Cup -->
        <rect x="262" y="155" width="28" height="60" rx="14" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
        <rect x="266" y="160" width="12" height="50" rx="6" fill="#0f172a"/>
        <!-- Planar Acoustic Mesh Center Accent -->
        <circle cx="124" cy="185" r="5" fill="#a78bfa"/>
        <circle cx="276" cy="185" r="5" fill="#a78bfa"/>
      </g>
    

  <!-- Bottom Info Glow Bar -->
  <rect x="20" y="248" width="360" height="38" rx="8" fill="#0b0f19" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
  <circle cx="36" cy="267" r="4" fill="#8b5cf6"/>
  <text x="48" y="271" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Tracer Studio Headphones</text>
  <text x="368" y="271" font-family="monospace" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="end">AU-001</text>
</svg>
