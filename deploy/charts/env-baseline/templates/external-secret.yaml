{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cart-redis
  labels:
    {{- include "baseline.commonLabels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: cart-redis
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kubeshop/{{ .Values.environment }}/redis
        property: password
{{- end }}
