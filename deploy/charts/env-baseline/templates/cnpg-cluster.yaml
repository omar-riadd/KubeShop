{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.name }}
    {{- include "baseline.commonLabels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: orders
      owner: orders
  storage:
    size: {{ .Values.postgres.storage.size }}
    storageClass: {{ .Values.postgres.storage.storageClass }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  monitoring:
    enablePodMonitor: {{ .Values.postgres.enablePodMonitor }}
  {{- if or .Values.nodeSelector .Values.tolerations }}
  affinity:
    {{- with .Values.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: {{ .Values.postgres.name }}
      {{- include "baseline.commonLabels" . | nindent 6 }}
{{- end }}
