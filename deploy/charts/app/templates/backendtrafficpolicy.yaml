{{- if and .Values.route.enabled .Values.route.rateLimit.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "kubeshop.name" . }}-ratelimit
  labels:
    {{- include "kubeshop.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "kubeshop.name" . }}
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: {{ .Values.route.rateLimit.requestsPerSecond }}
            unit: Second
{{- end }}
