{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubeshop.name" . }}
  labels:
    {{- include "kubeshop.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubeshop.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: synthetic-traffic
        {{- range .Values.networkPolicy.allowIngressFromApps }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.ports.http }}
    {{- if eq .Values.app.kind "backend" }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.ports.admin }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if and .Values.networkPolicy.allowOtel (eq .Values.app.kind "backend") }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
    {{- end }}
    {{- range .Values.networkPolicy.allowEgressToApps }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if .Values.networkPolicy.allowRedis }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    {{- if .Values.networkPolicy.allowPostgres }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: orders-db
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
{{- end }}
