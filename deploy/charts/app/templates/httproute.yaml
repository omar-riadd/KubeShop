{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kubeshop.name" . }}
  labels:
    {{- include "kubeshop.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      backendRefs:
        - name: {{ include "kubeshop.name" . }}
          port: 80
          {{- if eq .Values.strategy.type "canary" }}
          weight: 100
        - name: {{ include "kubeshop.name" . }}-canary
          port: 80
          weight: 0
          {{- end }}
{{- end }}
