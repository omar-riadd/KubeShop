worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  upstream catalog_upstream {
    server catalog:8080;
  }

  upstream cart_upstream {
    server cart:8080;
  }

  upstream orders_upstream {
    server orders:8080;
  }

  upstream web_upstream {
    server web:8080;
  }

  server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    # Exact §1.4 prefix routing with NO path rewriting
    location /api/catalog {
      proxy_pass http://catalog_upstream;
    }

    location /api/cart {
      proxy_pass http://cart_upstream;
    }

    location /api/orders {
      proxy_pass http://orders_upstream;
    }

    location / {
      proxy_pass http://web_upstream;
    }
  }
}
