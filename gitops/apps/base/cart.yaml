app:
  name: cart
  kind: backend

image:
  repository: ghcr.io/<GH_OWNER>/kubeshop-cart

strategy:
  type: canary

ports:
  http: 8080
  admin: 9090

probes:
  livenessPath: /healthz
  readinessPath: /readyz
  portName: admin

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

securityContext:
  runAsUser: 65532
  runAsGroup: 65532

env:
  - name: CATALOG_BASE_URL
    value: http://catalog:80
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: otel-collector.observability.svc.cluster.local:4317

secretEnv:
  - name: REDIS_URL
    secretName: cart-redis
    key: url

route:
  enabled: true
  pathPrefix: /api/cart

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true
  allowIngressFromApps:
    - orders
  allowEgressToApps:
    - catalog
  allowRedis: true
  allowPostgres: false
  allowOtel: true
