environment: prod

nodeSelector:
  workload: prod

tolerations:
  - key: workload
    operator: Equal
    value: prod
    effect: NoSchedule

quota:
  requestsCpu: "8"
  requestsMemory: "8Gi"
  limitsCpu: "16"
  limitsMemory: "16Gi"
  pods: "60"

redis:
  persistence:
    enabled: true
    storageClass: gp3
    size: 2Gi
  pdb:
    enabled: true
    minAvailable: 1

postgres:
  instances: 2
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

syntheticTraffic:
  enabled: true
  ratePerSecond: "1"
  orderProbability: "0.05"
