environment: staging

quota:
  requestsCpu: "6"
  requestsMemory: "6Gi"
  limitsCpu: "12"
  limitsMemory: "12Gi"
  pods: "40"

redis:
  persistence:
    enabled: true
    storageClass: gp3
    size: 1Gi

postgres:
  instances: 1
  storage:
    size: 10Gi

syntheticTraffic:
  enabled: true
  ratePerSecond: "1"
  orderProbability: "0.15"
