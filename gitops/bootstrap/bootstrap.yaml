apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeshop-projects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/<GH_OWNER>/kubeshop-platform.git
    targetRevision: main
    path: gitops/apps
    directory:
      include: "project.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
