apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-rollouts-canary
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: kubeshop
data:
  kubeshop-rollouts-canary.json: |
    {
      "uid": "kubeshop-rollouts-canary",
      "title": "KubeShop — Argo Rollouts Canary Comparison",
      "tags": ["kubeshop", "rollouts", "canary"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Success Rate by Pod (Stable vs Canary)",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [
            {
              "expr": "sum by (namespace, service, pod) (rate(http_requests_total{namespace=~\"kubeshop-.*\",status!~\"5..\"}[2m])) / clamp_min(sum by (namespace, service, pod) (rate(http_requests_total{namespace=~\"kubeshop-.*\"}[2m])), 1e-9)",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 Latency by Pod (Stable vs Canary)",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, namespace, pod) (rate(http_request_duration_seconds_bucket{namespace=~\"kubeshop-.*\"}[2m])))",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Rollout Phase Status",
          "gridPos": {"x": 0, "y": 8, "w": 24, "h": 8},
          "targets": [
            {
              "expr": "rollout_phase{namespace=~\"kubeshop-.*\"}",
              "legendFormat": "{{namespace}}/{{name}} ({{phase}})"
            }
          ]
        }
      ]
    }
