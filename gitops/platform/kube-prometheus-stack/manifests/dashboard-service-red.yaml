apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-service-red
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: kubeshop
data:
  kubeshop-service-red.json: |
    {
      "uid": "kubeshop-service-red",
      "title": "KubeShop — Service RED",
      "tags": ["kubeshop", "red"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(http_requests_total, namespace)",
            "current": {"text": "kubeshop-dev", "value": "kubeshop-dev"}
          },
          {
            "name": "service",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(http_requests_total{namespace=\"$namespace\"}, service)",
            "current": {"text": "catalog", "value": "catalog"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate (req/s)",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "sum by (route) (rate(http_requests_total{namespace=\"$namespace\",service=\"$service\"}[5m]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "5xx Error Rate (%)",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\",service=\"$service\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace=\"$namespace\",service=\"$service\"}[5m])), 1e-9)",
              "legendFormat": "5xx ratio"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Latency Quantiles (p50 / p95 / p99)",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\",service=\"$service\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\",service=\"$service\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\",service=\"$service\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "In-Flight Requests",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "sum by (pod) (http_requests_in_flight{namespace=\"$namespace\",service=\"$service\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
