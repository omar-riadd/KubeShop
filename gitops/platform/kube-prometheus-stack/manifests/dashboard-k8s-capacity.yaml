apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-capacity
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: kubeshop
data:
  kubeshop-k8s-capacity.json: |
    {
      "uid": "kubeshop-k8s-capacity",
      "title": "KubeShop — Kubernetes Capacity & Autoscaling",
      "tags": ["kubeshop", "kubernetes", "autoscaling"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "CPU Usage vs Requests by Namespace",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"kubeshop-.*\",container!=\"\"}[5m]))",
              "legendFormat": "{{namespace}} usage"
            },
            {
              "expr": "sum by (namespace) (kube_pod_container_resource_requests{namespace=~\"kubeshop-.*\",resource=\"cpu\"})",
              "legendFormat": "{{namespace}} requests"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Memory Working Set vs Requests by Namespace",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "targets": [
            {
              "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"kubeshop-.*\",container!=\"\"})",
              "legendFormat": "{{namespace}} working set"
            },
            {
              "expr": "sum by (namespace) (kube_pod_container_resource_requests{namespace=~\"kubeshop-.*\",resource=\"memory\"})",
              "legendFormat": "{{namespace}} requests"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HPA & KEDA Replica Count",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"kubeshop-.*\"}",
              "legendFormat": "{{namespace}}/{{horizontalpodautoscaler}} current"
            },
            {
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=~\"kubeshop-.*\"}",
              "legendFormat": "{{namespace}}/{{horizontalpodautoscaler}} desired"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Container Restarts (15m)",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"kubeshop-.*\"}[15m]))",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        }
      ]
    }
