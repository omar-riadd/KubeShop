provider:
  name: aws

env:
  - name: AWS_DEFAULT_REGION
    value: eu-central-1

sources:
  - gateway-httproute
  - service

domainFilters:
  - <BASE_DOMAIN>

policy: sync
txtOwnerId: kubeshop-eks

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/kubeshop-external-dns

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
