apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
    - name: service-name
    - name: namespace
    - name: canary-hash
  metrics:
    - name: success-rate
      interval: 30s
      count: 3
      successCondition: len(result) == 0 || result[0] >= 0.99
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{namespace="{{args.namespace}}",service="{{args.service-name}}",pod=~"{{args.service-name}}-{{args.canary-hash}}-.*",status!~"5.."}[2m]))
            /
            sum(rate(http_requests_total{namespace="{{args.namespace}}",service="{{args.service-name}}",pod=~"{{args.service-name}}-{{args.canary-hash}}-.*"}[2m]))
---
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: latency-p95
spec:
  args:
    - name: service-name
    - name: namespace
    - name: canary-hash
  metrics:
    - name: latency-p95
      interval: 30s
      count: 3
      successCondition: len(result) == 0 || result[0] <= 0.5
      failureLimit: 1
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{args.namespace}}",service="{{args.service-name}}",pod=~"{{args.service-name}}-{{args.canary-hash}}-.*"}[2m]))
            )
---
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: web-healthz
spec:
  args:
    - name: service-name
    - name: namespace
  metrics:
    - name: healthz-check
      interval: 10s
      count: 3
      failureLimit: 1
      provider:
        web:
          url: "http://{{args.service-name}}.{{args.namespace}}.svc/healthz"
          timeoutSeconds: 5
          insecure: false
