apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-image-signature
  annotations:
    policies.kyverno.io/title: Verify KubeShop Image Signature (Cosign Keyless)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
spec:
  validationActions:
    - Audit
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubeshop.io/env
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/<GH_OWNER>/kubeshop-*"
  attestors:
    - name: github_actions_oidc
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/<GH_OWNER>/kubeshop-platform/\\.github/workflows/.+@refs/heads/main$"
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.github_actions_oidc])).all(count, count > 0)
      message: "KubeShop images must carry a valid Cosign keyless signature from GitHub Actions on main."
