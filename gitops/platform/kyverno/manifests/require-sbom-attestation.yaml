apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-sbom-attestation
  annotations:
    policies.kyverno.io/title: Require CycloneDX SBOM Attestation (Audit)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: medium
spec:
  validationActions:
    - Audit
  webhookConfiguration:
    timeoutSeconds: 30
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubeshop.io/env
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/<GH_OWNER>/kubeshop-*"
  attestors:
    - name: github-actions-oidc
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/<GH_OWNER>/kubeshop-platform/\\.github/workflows/.+@refs/heads/main$"
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: cyclonedx-sbom
      intoto:
        type: https://cyclonedx.org/bom
  validations:
    - expression: >-
        images.containers.map(image, verifyAttestations(image, [attestations.cyclonedx-sbom], [attestors.github-actions-oidc])).all(count, count > 0)
      message: "KubeShop images should include a signed CycloneDX SBOM attestation."
