apiVersion: v1
kind: Pod
metadata:
  name: compliant-catalog-pod
  namespace: kubeshop-dev
  labels:
    app.kubernetes.io/name: catalog
    kubeshop.io/env: dev
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: catalog
      image: ghcr.io/<GH_OWNER>/kubeshop-catalog:sha-1234567
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
---
