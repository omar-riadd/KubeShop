name: OpenAPI Lint

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/openapi-lint.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'

permissions:
  contents: read

jobs:
  openapi-lint:
    name: Lint api/openapi.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Lint OpenAPI spec with Redocly CLI
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml --config api/redocly.yaml
