name: CI — Web Storefront

on:
  pull_request:
    paths:
      - 'web/**'
      - 'api/openapi.yaml'
      - '.github/workflows/ci-web.yml'
      - '.github/workflows/_publish-image.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/openapi.yaml'
      - '.github/workflows/ci-web.yml'
      - '.github/workflows/_publish-image.yml'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  lint:
    name: Lint, Typecheck & OpenAPI Drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm tsc --noEmit

      - name: Check OpenAPI generated types drift
        run: |
          pnpm gen:api
          git diff --exit-code src/api/schema.d.ts

  unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest suite with coverage
        run: pnpm test:coverage

  build:
    name: Production Build & Bundle Guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Verify production bundle invariants
        run: |
          test ! -f dist/mockServiceWorker.js
          test -f dist/theme-init.js
          test -f dist/index.html
          echo "Verified: mockServiceWorker.js absent, theme-init.js and index.html present."

  e2e:
    name: Playwright E2E & Axe Accessibility
    needs: [lint, unit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies & Playwright Chromium
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Start full local stack
        run: make up

      - name: Run Playwright E2E and Axe accessibility suite
        working-directory: web
        env:
          BASE_URL: http://localhost:8080
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ''
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Tear down local stack
        if: always()
        run: make down

  audit:
    name: Dependency & Filesystem Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run pnpm audit (production dependencies)
        working-directory: web
        run: pnpm audit --prod --audit-level=high

      - name: Run Trivy filesystem scan on web/
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: web
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  image:
    name: Publish (web)
    needs: [lint, unit, build, e2e, audit]
    uses: ./.github/workflows/_publish-image.yml
    with:
      app: web
      image-name: kubeshop-web
      context: web
      dockerfile: web/Dockerfile
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
