name: Terraform Validate, Plan & Apply

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to execute'
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  validate:
    name: Format, Validate, TFLint & Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.11.4'

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform configurations
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/envs/main; do
            if [ -d "${dir}" ]; then
              echo "Validating ${dir}..."
              terraform -chdir="${dir}" init -backend=false
              terraform -chdir="${dir}" validate
            fi
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@9735174880517a656603706233548495c20172d4 # v4.1.1

      - name: Run TFLint
        run: |
          if [ -d infra/terraform/envs/main ]; then
            tflint --chdir=infra/terraform/envs/main --init
            tflint --chdir=infra/terraform/envs/main --recursive
          fi

      - name: Run Trivy Terraform misconfiguration scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: '1'

  plan:
    name: Terraform Plan (OIDC Read-Only)
    needs: validate
    if: (github.event_name == 'pull_request' || inputs.action == 'plan') && vars.AWS_TERRAFORM_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC (read-only)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.11.4'

      - name: Terraform Init & Plan
        id: plan
        working-directory: infra/terraform/envs/main
        run: |
          terraform init
          terraform plan -no-color -out=tfplan | tee plan.txt

      - name: Comment plan summary on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY=$(tail -n 60 infra/terraform/envs/main/plan.txt)
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$(printf '### Terraform Plan Summary\n```hcl\n%s\n```' "${SUMMARY}")"

  apply:
    name: Terraform Apply (Protected Environment)
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    environment: aws-prod-apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC (apply role)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.11.4'

      - name: Terraform Init & Apply
        working-directory: infra/terraform/envs/main
        run: |
          terraform init
          terraform apply -auto-approve
