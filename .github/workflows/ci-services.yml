name: CI — Go Services

on:
  pull_request:
    paths:
      - 'services/**'
      - 'api/**'
      - '.github/workflows/ci-services.yml'
      - '.github/workflows/_publish-image.yml'
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'api/**'
      - '.github/workflows/ci-services.yml'
      - '.github/workflows/_publish-image.yml'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  lint-and-test:
    name: Vet, Lint & Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - internal/platform
          - catalog
          - cart
          - orders
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum

      - name: Run go vet
        working-directory: services
        run: go vet ./${{ matrix.package }}/...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1481404843c368bc19ca9406f87d6e0fc97bdcfd # v7.0.0
        with:
          version: v2.15.0
          working-directory: services
          args: ./${{ matrix.package }}/...

      - name: Run unit, integration & OpenAPI contract tests (≥80% coverage gate)
        working-directory: services
        run: |
          TARGET="./${{ matrix.package == 'internal/platform' && 'internal/platform' || format('{0}/internal', matrix.package) }}"
          OUT="coverage-${{ matrix.package == 'internal/platform' && 'platform' || matrix.package }}.out"
          go test -v -race -coverprofile="$OUT" "$TARGET"
          TOTAL=$(go tool cover -func="$OUT" | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Package $TARGET coverage: ${TOTAL}%"
          awk -v cov="$TOTAL" 'BEGIN { if (cov + 0 < 80.0) { printf "ERROR: coverage %.1f%% is below 80.0%% threshold\n", cov; exit 1 } }'

  publish:
    name: Publish (${{ matrix.service }})
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, cart, orders]
    uses: ./.github/workflows/_publish-image.yml
    with:
      app: ${{ matrix.service }}
      image-name: kubeshop-${{ matrix.service }}
      context: services
      dockerfile: services/${{ matrix.service }}/Dockerfile
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit
